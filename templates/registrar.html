<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto - MarginTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📊 MarginTracker</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Registrar Nuevo Producto</h4>
                    </div>
                    <div class="card-body">
                        <form action="/registrar" method="POST">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Producto</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría</label>
                                <input type="text" class="form-control" id="categoria" name="categoria" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="stock" class="form-label">Stock</label>
                                    <input type="number" class="form-control" id="stock" name="stock" value="10" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="precio_costo" class="form-label">Precio de Costo ($)</label>
                                    <input type="number" step="0.01" class="form-control" id="precio_costo" name="precio_costo" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="precio_venta" class="form-label">Precio de Venta ($)</label>
                                    <input type="number" step="0.01" class="form-control" id="precio_venta" name="precio_venta" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="impuestos" class="form-label">Impuestos ($)</label>
                                    <input type="number" step="0.01" class="form-control" id="impuestos" name="impuestos" value="0.00" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="envios" class="form-label">Costo de Envío ($)</label>
                                    <input type="number" step="0.01" class="form-control" id="envios" name="envios" value="0.00" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar Producto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
